name: LCS Core CI/CD & Integrity Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    name: Test & Integrity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .[dev]

      - name: Cryptographic Checksum Invariance Verification
        run: |
          python -c "
          import hashlib, sys
          frozen = {
              'capability_retrieval_v1.py': 'b7d476236d2f5addd6619f619a6f1145bf407a6917d20493e4d85afd0ca843b4',
              'capability_retrieval_v1_1.py': '2a29c3dcec1e792021a63707fec9a92c3a6505080b0c05a63e377c69ce272e12',
              'capability_parameter_v1.py': '469b743cf6af1f6807544f2182dee12a4708ceb5512dd32185c4e5986a524c00',
              'capability_planning_v1.py': 'eb81b3255d58958d73689b99cb8506647f8c781d30d93cea1c90dfd435d070e4',
              'governance_policy_v1.py': '5273f17e83d1c90cd5f935b815841db711a3523a08d1d180f2a4d67bcad44252',
          }
          failed = False
          for f, expected in frozen.items():
              h = hashlib.sha256(open(f, 'rb').read()).hexdigest()
              if h != expected:
                  print(f'MISMATCH in {f}: expected {expected}, got {h}')
                  failed = True
              else:
                  print(f'VERIFIED: {f}')
          if failed:
              sys.exit(1)
          print('ALL 5 FROZEN MODULES VERIFIED BIT-FOR-BIT IDENTICAL.')
          "

      - name: Execute Full Authoritative Test Suite
        run: |
          pytest -v -q --tb=short

      - name: Verify CLI Functionality
        run: |
          lcs --help
          lcs status
