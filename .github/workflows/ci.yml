name: LCS Core CI/CD & Integrity Pipeline

on:
  push:
    branches: [ main, 'verify/**', 'stage5**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    name: Test & Integrity (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Cryptographic Checksum Invariance Verification
        run: |
          python scripts/verify_frozen_hashes.py

      - name: Execute Full Authoritative Test Suite
        run: |
          pytest -v -q --tb=short

      - name: Verify CLI Functionality
        run: |
          lcs --help
          lcs status
